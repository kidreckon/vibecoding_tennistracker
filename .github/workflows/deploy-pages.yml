name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages on every push. `enablement: true`
# turns Pages on automatically the first time, so no manual Settings step.
on:
  push:
    branches: [claude/tennis-tracking-video-editor-k1aaji]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
